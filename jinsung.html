<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 모바일 웹앱 및 상태바 설정 (iOS & Android) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    
    <title>진성디지털 - 여수 학교 관리 시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* 앱 상단 헤더 */
        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px 20px 16px;
            text-align: center;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        header p {
            font-size: 12px;
            color: #94a3b8;
        }

        .main-content {
            padding: 20px;
            flex: 1;
        }

        /* 검색 박스 */
        .search-box {
            position: relative;
            margin-bottom: 8px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px; /* iOS 자동 확대 방지 (16px 이상) */
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        .search-box input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-tip {
            font-size: 11px;
            color: #64748b;
            text-align: right;
            margin-bottom: 16px;
        }

        /* 결과 카드 */
        .result-card {
            display: none;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-result {
            text-align: center;
            padding-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .badge-jinsung { background-color: #2563eb; }
        .badge-office { background-color: #059669; }

        .school-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        /* A/S 목록 영역 */
        .as-section {
            display: none;
            margin-top: 12px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 14px;
        }

        .as-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .as-header h3 {
            font-size: 14px;
            color: #334155;
        }

        .btn-add {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .as-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .as-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }

        .as-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .as-date {
            font-weight: 700;
            color: #2563eb;
        }

        .as-engineer {
            color: #64748b;
            font-size: 11px;
        }

        .as-content {
            color: #334155;
            line-height: 1.4;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .btn-edit {
            background-color: #f59e0b;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .no-result {
            display: none;
            text-align: center;
            color: #ef4444;
            font-size: 13px;
            padding: 20px;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-content h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #f8fafc;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-save {
            flex: 1;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: #94a3b8;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>진성디지털 사이트 구분</h1>
        <p>여수 지역 학교 소속 판별 및 A/S 이력 관리</p>
    </header>

    <div class="main-content">
        <div class="search-box">
            <input type="text" id="schoolInput" placeholder="학교 이름 입력 (예: 백초초, 화양중...)" oninput="handleInput()" onkeypress="handleKeyPress(event)" autocomplete="off">
        </div>
        <div class="search-tip">↵ Enter 키를 누르면 A/S 목록이 출력됩니다.</div>

        <div id="resultCard" class="result-card">
            <div class="header-result">
                <span id="typeBadge" class="badge"></span>
                <div id="schoolName" class="school-title">-</div>
            </div>

            <div id="asSection" class="as-section">
                <div class="as-header">
                    <h3>🛠 A/S 조치 이력</h3>
                    <button class="btn-add" onclick="openAddModal()">+ 추가</button>
                </div>
                <div id="asList" class="as-list"></div>
            </div>
        </div>

        <div id="noResult" class="no-result">
            검색 결과가 없습니다. 학교명을 확인해 주세요.
        </div>
    </div>
</div>

<!-- 작성 / 수정 모달 -->
<div id="asModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">A/S 이력 등록</h3>
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
            <label>점검 일자</label>
            <input type="date" id="modalDate">
        </div>
        <div class="form-group">
            <label>담당 기사명</label>
            <input type="text" id="modalEngineer" placeholder="예: 김철수 기사">
        </div>
        <div class="form-group">
            <label>조치 및 처리 내용</label>
            <textarea id="modalContent" rows="3" placeholder="처리 내역 입력"></textarea>
        </div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveAsItem()">저장</button>
            <button class="btn-cancel" onclick="closeModal()">취소</button>
        </div>
    </div>
</div>

<script>
    // 교육청 사이트 전용 목록 (나머지는 모두 진성디지털 직속 사이트)
    const officeSchoolNames = [
        "백초초등학교", "동백초등학교", "진남초등학교", "여수교육지원청", "종고초등학교", "안일초등학교",
        "돌산중학교", "돌산초등학교", "돌산중앙중학교", "봉덕초등학교", "소라초등학교", "성산유치원",
        "무선초등학교", "무선중학교", "신풍초등학교", "율촌초등학교", "율촌중학교", "봉산초등학교",
        "남산초등학교", "여수서초등학교", "여수남초등학교", "구봉중학교", "예울초등학교", "관기초등학교",
        "나진초등학교", "화양초등학교", "화양중학교", "안심초등학교", "시전초등학교", "미평초등학교",
        "진남중학교", "여수북초등학교", "문수초등학교", "좌수영초등학교", "송현초등학교", "여남초등학교",
        "여남중학교", "여남고등학교", "거문초등학교", "거문중학교", "화정초등학교", "개도중학교",
        "경호초등학교", "돌산초등학교 두라분교장", "여수여자고등학교"
    ];

    let currentSchool = null;

    function getAsStorage() {
        const saved = localStorage.getItem("jinsung_as_data");
        return saved ? JSON.parse(saved) : {};
    }

    function handleInput() {
        const query = document.getElementById('schoolInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const noResult = document.getElementById('noResult');
        const asSection = document.getElementById('asSection');

        asSection.style.display = "none";

        if (query === "") {
            resultCard.style.display = "none";
            noResult.style.display = "none";
            currentSchool = null;
            return;
        }

        // 교육청 학교 검색
        const matchedOffice = officeSchoolNames.find(name => name.includes(query) || query.includes(name.replace(/초등학교|중학교|고등학교/g, "")));

        if (matchedOffice) {
            currentSchool = matchedOffice;
            showResult(matchedOffice, "교육청", "교육청 관리 사이트", "badge-office");
        } else {
            // 나머지 모든 학교 -> 진성디지털 직속 사이트
            currentSchool = query.endsWith("고") || query.endsWith("중") || query.endsWith("초") ? query : query + " (직속)";
            showResult(currentSchool, "직속", "진성디지털 직속 사이트", "badge-jinsung");
        }
    }

    function showResult(title, type, badgeText, badgeClass) {
        document.getElementById('schoolName').innerText = title;
        const badge = document.getElementById('typeBadge');
        badge.innerText = badgeText;
        badge.className = "badge " + badgeClass;
        document.getElementById('resultCard').style.display = "block";
        document.getElementById('noResult').style.display = "none";
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            if (currentSchool) {
                renderAsList();
                document.getElementById('asSection').style.display = "block";
            }
        }
    }

    function renderAsList() {
        const data = getAsStorage();
        const list = data[currentSchool] || [];
        const container = document.getElementById('asList');
        container.innerHTML = "";

        if (list.length === 0) {
            container.innerHTML = "<div style='color:#94a3b8; text-align:center; padding:12px; font-size:12px;'>등록된 A/S 이력이 없습니다.</div>";
            return;
        }

        list.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = "as-item";
            div.innerHTML = `
                <div class="as-item-header">
                    <span class="as-date">${item.date}</span>
                    <span class="as-engineer">${item.engineer}</span>
                </div>
                <div class="as-content">${item.content}</div>
                <div class="btn-group">
                    <button class="btn-edit" onclick="openEditModal(${index})">수정</button>
                    <button class="btn-delete" onclick="deleteAsItem(${index})">삭제</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteAsItem(index) {
        if (confirm("해당 A/S 이력을 삭제하시겠습니까?")) {
            const data = getAsStorage();
            if (data[currentSchool]) {
                data[currentSchool].splice(index, 1);
                localStorage.setItem("jinsung_as_data", JSON.stringify(data));
                renderAsList();
            }
        }
    }

    function openAddModal() {
        document.getElementById('modalTitle').innerText = `${currentSchool} A/S 추가`;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('modalDate').value = new Date().toISOString().substring(0, 10);
        document.getElementById('modalEngineer').value = "";
        document.getElementById('modalContent').value = "";
        document.getElementById('asModal').style.display = "flex";
    }

    function openEditModal(index) {
        const data = getAsStorage();
        const item = data[currentSchool][index];
        document.getElementById('modalTitle').innerText = `${currentSchool} A/S 수정`;
        document.getElementById('editIndex').value = index;
        document.getElementById('modalDate').value = item.date;
        document.getElementById('modalEngineer').value = item.engineer;
        document.getElementById('modalContent').value = item.content;
        document.getElementById('asModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('asModal').style.display = "none";
    }

    function saveAsItem() {
        const index = parseInt(document.getElementById('editIndex').value);
        const date = document.getElementById('modalDate').value;
        const engineer = document.getElementById('modalEngineer').value.trim();
        const content = document.getElementById('modalContent').value.trim();

        if (!date || !engineer || !content) {
            alert("모든 필드를 입력해 주세요.");
            return;
        }

        const data = getAsStorage();
        if (!data[currentSchool]) data[currentSchool] = [];

        if (index === -1) {
            data[currentSchool].unshift({ date, engineer, content });
        } else {
            data[currentSchool][index] = { date, engineer, content };
        }

        localStorage.setItem("jinsung_as_data", JSON.stringify(data));
        closeModal();
        renderAsList();
    }
</script>

</body>
</html>
